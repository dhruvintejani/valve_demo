name: Verify RFQ demo
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/rfq-select-clipping-and-ux]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
